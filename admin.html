<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lasani Admin — Menu Editor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f5f0e8;min-height:100vh;padding:24px 16px}
.wrap{width:100%;max-width:820px;margin:0 auto}
h1{font-size:22px;font-weight:600;color:#1a0a00;margin-bottom:4px}
.sub{color:#999;font-size:13px;margin-bottom:28px}
section{background:#fff;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
h2{font-size:13px;font-weight:600;color:#8b1500;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:#aaa;padding:6px 10px;border-bottom:2px solid #f0e8d8;font-weight:500;letter-spacing:.5px}
td{padding:10px 10px;font-size:14px;border-bottom:1px solid #faf0e0;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:nth-child(even){background:#fdf8f0}
.item-name{font-weight:500;color:#1a0a00}
.item-ur{font-family:'Noto Nastaliq Urdu',serif;direction:rtl;color:#7a5230;font-size:13px}
input[type=number]{
  width:86px;padding:7px 10px;border-radius:8px;
  border:1.5px solid #e0d4c0;font-size:14px;
  text-align:right;background:#fffdf8;color:#1a0a00;
  outline:none;transition:border-color .15s;
}
input[type=number]:focus{border-color:#c0200a}
.dash{color:#ccc;font-size:18px}
.footer{text-align:center;padding:12px 0 32px}
.save-btn{
  padding:14px 40px;border-radius:12px;
  background:linear-gradient(135deg,#c0200a,#e87800);
  color:#fff;border:none;font-size:16px;font-weight:600;
  cursor:pointer;letter-spacing:.5px;
  box-shadow:0 4px 16px rgba(192,32,10,.35);
  transition:opacity .15s;
}
.save-btn:disabled{opacity:.6;cursor:not-allowed}
.ok {color:#1a7a1a;margin-top:14px;font-size:14px;font-weight:500}
.err{color:#c00;   margin-top:14px;font-size:14px;font-weight:500}
.token-wrap{
  background:#fff8ec;border:1.5px solid #e8d4a8;
  border-radius:10px;padding:14px 16px;margin-bottom:24px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.token-wrap label{font-size:13px;color:#7a5230;font-weight:500;white-space:nowrap}
.token-wrap input{
  flex:1;min-width:220px;padding:8px 12px;border-radius:8px;
  border:1.5px solid #d4b07a;font-size:13px;font-family:monospace;
  background:#fffdf8;color:#1a0a00;outline:none;
}
.token-wrap input:focus{border-color:#c0200a}
.token-tip{font-size:11px;color:#a08060;width:100%;margin-top:2px}
.loader{text-align:center;padding:48px;color:#aaa;font-size:15px}
</style>
</head>
<body>
<div class="wrap">

  <h1>🍽️ Lasani Menu Editor</h1>
  <p class="sub" id="last-updated">Loading menu…</p>

  <!-- GitHub Token input (saved in sessionStorage — gone when tab closes) -->
  <div class="token-wrap">
    <label>🔑 GitHub Token</label>
    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
           oninput="saveToken(this.value)">
    <span class="token-tip">
      Sirf is session ke liye save hoga. Tab band karo toh automatically hat jata hai.
    </span>
  </div>

  <div id="cats"><div class="loader">Menu load ho raha hai…</div></div>

  <div class="footer">
    <button class="save-btn" onclick="saveMenu()" id="saveBtn">💾 Save &amp; Publish</button>
    <p class="ok"  id="ok-msg"  style="display:none"></p>
    <p class="err" id="err-msg" style="display:none"></p>
  </div>

</div>

<script>
// ── CONFIG — apna GitHub info yahan bharo ─────────────────────────────────────
const OWNER  = 'YOUR_GITHUB_USERNAME';   // e.g. 'ahmed123'
const REPO   = 'YOUR_REPO_NAME';         // e.g. 'lasani-website'
const BRANCH = 'main';
const FILE   = 'menu.json';
// ─────────────────────────────────────────────────────────────────────────────

let menuData = null;

// Token sessionStorage mein rakho (page refresh par bhi rehta hai, tab band par jata hai)
function saveToken(val) { sessionStorage.setItem('gh_token', val.trim()); }
function getToken()     { return sessionStorage.getItem('gh_token') || ''; }

// Restore token if already entered this session
window.addEventListener('DOMContentLoaded', () => {
  const t = getToken();
  if (t) document.getElementById('gh-token').value = t;
  loadMenu();
});

// ── Load menu.json ────────────────────────────────────────────────────────────
async function loadMenu() {
  try {
    const r = await fetch('/menu.json?t=' + Date.now());
    if (!r.ok) throw new Error('menu.json nahi mili');
    menuData = await r.json();
    document.getElementById('last-updated').textContent =
      'Last updated: ' + (menuData.lastUpdated || 'unknown');
    renderMenu();
  } catch(e) {
    document.getElementById('cats').innerHTML =
      '<div class="loader" style="color:#c00">❌ menu.json load nahi hui: ' + e.message + '</div>';
  }
}

// ── Render editable table ─────────────────────────────────────────────────────
function renderMenu() {
  const container = document.getElementById('cats');
  container.innerHTML = '';

  menuData.categories.forEach((cat, ci) => {
    const sec = document.createElement('section');

    const rows = cat.items.map((item, ii) => `
      <tr>
        <td>
          <div class="item-name">${item.emoji || ''} ${item.en}</div>
          <div class="item-ur">${item.ur || ''}</div>
        </td>
        <td>${item.half   !== undefined
          ? `<input type="number" min="0" step="5" value="${item.half}"
               onchange="updatePrice(${ci},${ii},'half',this.value)">`
          : '<span class="dash">—</span>'}</td>
        <td>${item.full   !== undefined
          ? `<input type="number" min="0" step="5" value="${item.full}"
               onchange="updatePrice(${ci},${ii},'full',this.value)">`
          : '<span class="dash">—</span>'}</td>
        <td>${item.single !== undefined
          ? `<input type="number" min="0" step="5" value="${item.single}"
               onchange="updatePrice(${ci},${ii},'single',this.value)">`
          : '<span class="dash">—</span>'}</td>
      </tr>`).join('');

    sec.innerHTML = `
      <h2>${item_emoji(cat.id)} ${cat.label}</h2>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Half (Rs.)</th>
            <th>Full (Rs.)</th>
            <th>Single (Rs.)</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
    container.appendChild(sec);
  });
}

function item_emoji(id) {
  return {mains:'🍖', curries:'🥘', tandoor:'🫓', beverages:'🥛'}[id] || '🍽️';
}

// ── Price update in memory ────────────────────────────────────────────────────
function updatePrice(ci, ii, field, val) {
  menuData.categories[ci].items[ii][field] = Number(val);
}

// ── Save to GitHub ────────────────────────────────────────────────────────────
async function saveMenu() {
  const token = getToken();
  if (!token || !token.startsWith('ghp_')) {
    showMsg('err', '❌ Pehle GitHub Token enter karo (ghp_xxx...)');
    return;
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  showMsg('ok',  null);
  showMsg('err', null);

  try {
    menuData.lastUpdated = new Date().toISOString().slice(0, 10);
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(menuData, null, 2))));
    const apiUrl  = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
    const headers = {
      'Authorization': 'Bearer ' + token,
      'Accept':        'application/vnd.github+json',
      'Content-Type':  'application/json',
      'X-GitHub-Api-Version': '2022-11-28',
    };

    // 1. Get current SHA
    const getRes  = await fetch(apiUrl + '?ref=' + BRANCH, { headers });
    const getJson = await getRes.json();
    if (!getRes.ok) throw new Error('SHA fetch failed: ' + getJson.message);

    // 2. Commit updated file
    const putRes  = await fetch(apiUrl, {
      method: 'PUT', headers,
      body: JSON.stringify({
        message: 'chore: update menu prices ' + menuData.lastUpdated,
        content,
        sha:    getJson.sha,
        branch: BRANCH,
        committer: { name: 'Lasani Admin', email: 'admin@lasani.com' },
      }),
    });
    const putJson = await putRes.json();
    if (!putRes.ok) throw new Error(putJson.message);

    showMsg('ok', '✅ GitHub par save ho gaya! 1-2 minute mein site live ho jayegi.');
    document.getElementById('last-updated').textContent =
      'Last updated: ' + menuData.lastUpdated;

  } catch(e) {
    showMsg('err', '❌ Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Save & Publish';
  }
}

function showMsg(type, text) {
  const el = document.getElementById(type + '-msg');
  el.style.display = text ? 'block' : 'none';
  if (text) el.textContent = text;
}
</script>
</body>
</html>
