<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lasani Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f5f0e8;min-height:100vh;display:flex;justify-content:center;padding:32px 16px}
.wrap{width:100%;max-width:780px}
h1{font-size:20px;font-weight:600;color:#1a0a00;margin-bottom:4px}
.sub{color:#888;font-size:13px;margin-bottom:24px}
#login{background:#fff;border-radius:12px;padding:36px 28px;box-shadow:0 4px 20px rgba(0,0,0,.1);max-width:360px;margin:80px auto}
#login h1{text-align:center;margin-bottom:20px}
input[type=password],input[type=number]{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid #ddd;font-size:15px;margin-bottom:12px;outline:none}
input[type=number]{width:90px;text-align:right}
input:focus{border-color:#c0200a}
.btn{width:100%;padding:11px;border-radius:8px;background:#c0200a;color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:not-allowed}
.save-btn{padding:12px 32px;border-radius:10px;background:#c0200a;color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px}
.err{color:#c00;font-size:13px;margin-top:8px}
.ok{color:#1a7a1a;font-size:13px;margin-top:8px;font-weight:500}
section{background:#fff;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h2{font-size:14px;font-weight:600;color:#8b1500;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:#999;padding:5px 8px;border-bottom:2px solid #f0e8d8;font-weight:500}
td{padding:9px 8px;font-size:14px;border-bottom:1px solid #f8f0e0}
tr:nth-child(even){background:#faf5ec}
.footer{text-align:center;padding-top:8px}
#editor{display:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <h1>🔒 Lasani Admin</h1>
  <input type="password" id="pwd" placeholder="Admin password" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()">Unlock Panel</button>
  <p class="err" id="lerr"></p>
</div>

<!-- EDITOR -->
<div class="wrap" id="editor">
  <h1>🍽️ Menu Price Editor</h1>
  <p class="sub" id="last-updated"></p>

  <div id="cats"></div>

  <div class="footer">
    <button class="save-btn" onclick="saveMenu()" id="saveBtn">💾 Save & Publish to GitHub</button>
    <p class="ok"  id="ok-msg"></p>
    <p class="err" id="err-msg"></p>
  </div>
</div>

<script>
const OWNER   = 'syedtayaabbukhari-design';
const REPO    = 'lasani-v2';
const BRANCH  = 'main';
const FILE    = 'menu.json';
const PASSWORD = 'no password';
const TOKEN_KEY = 'gh_tok';

let menuData = null;

function login() {
  const pwd = document.getElementById('pwd').value;
  if (pwd !== PASSWORD) {
    document.getElementById('lerr').textContent = '❌ Wrong password';
    return;
  }
  sessionStorage.setItem('authed','1');
  document.getElementById('login').style.display = 'none';
  document.getElementById('editor').style.display = 'block';
  loadMenu();
}

async function loadMenu() {
  const r = await fetch('/menu.json?t=' + Date.now());
  menuData = await r.json();
  document.getElementById('last-updated').textContent = 'Last updated: ' + menuData.lastUpdated;
  renderMenu();
}

function renderMenu() {
  const container = document.getElementById('cats');
  container.innerHTML = '';
  menuData.categories.forEach((cat, ci) => {
    const sec = document.createElement('section');
    sec.innerHTML = '<h2>' + cat.label + '</h2>' +
      '<table><thead><tr><th>Item</th><th>اردو</th><th>Half</th><th>Full</th><th>Single</th></tr></thead><tbody>' +
      cat.items.map((item, ii) =>
        '<tr>' +
        '<td>' + item.emoji + ' ' + item.en + '</td>' +
        '<td style="direction:rtl;font-family:serif">' + item.ur + '</td>' +
        '<td>' + (item.half   !== undefined ? '<input type="number" min="0" step="5" value="' + item.half   + '" onchange="updatePrice(' + ci + ',' + ii + ','half'  ,this.value)">' : '—') + '</td>' +
        '<td>' + (item.full   !== undefined ? '<input type="number" min="0" step="5" value="' + item.full   + '" onchange="updatePrice(' + ci + ',' + ii + ','full'  ,this.value)">' : '—') + '</td>' +
        '<td>' + (item.single !== undefined ? '<input type="number" min="0" step="5" value="' + item.single + '" onchange="updatePrice(' + ci + ',' + ii + ','single',this.value)">' : '—') + '</td>' +
        '</tr>'
      ).join('') +
      '</tbody></table>';
    container.appendChild(sec);
  });
}

function updatePrice(ci, ii, field, val) {
  menuData.categories[ci].items[ii][field] = Number(val);
}

async function saveMenu() {
  const token = prompt('GitHub Token paste karo (ghp_xxx...):');
  if (!token || !token.startsWith('ghp_')) { alert('Invalid token'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  document.getElementById('ok-msg').textContent  = '';
  document.getElementById('err-msg').textContent = '';

  try {
    menuData.lastUpdated = new Date().toISOString().slice(0,10);
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(menuData, null, 2))));
    const api = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + FILE;
    const headers = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' };

    const getRes  = await fetch(api + '?ref=' + BRANCH, { headers });
    const getJson = await getRes.json();
    if (!getRes.ok) throw new Error(getJson.message);

    const putRes  = await fetch(api, { method:'PUT', headers, body: JSON.stringify({
      message: 'chore: update menu prices ' + menuData.lastUpdated,
      content, sha: getJson.sha, branch: BRANCH,
      committer: { name:'Lasani Admin', email:'admin@lasani.com' }
    })});
    const putJson = await putRes.json();
    if (!putRes.ok) throw new Error(putJson.message);

    document.getElementById('ok-msg').textContent = '✅ Saved! GitHub par commit ho gaya. 1-2 min mein live hoga.';
  } catch(e) {
    document.getElementById('err-msg').textContent = '❌ Error: ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = '💾 Save & Publish to GitHub';
  }
}
</script>
</body>
</html>
