<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lasani Admin — Menu Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#C0200A;--red-dark:#8B1500;--saffron:#E87800;
  --gold:#D4A017;--cream:#FFF8EC;--parchment:#F5E8C8;
  --tan:#E8D4A8;--smoke:#FAF3E0;--ink:#1A0A00;--muted:#7A5230;
  --border:#D4B07A;
}
body{font-family:'Oswald',sans-serif;background:var(--smoke);min-height:100vh;padding:0 0 60px}

/* HEADER */
.header{
  background:linear-gradient(135deg,#2a0500,#8B1500 50%,#C0200A);
  padding:18px 20px;
  border-bottom:3px solid var(--gold);
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.header h1{color:#fff;font-size:1.15rem;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.header .sub{color:rgba(255,255,255,0.6);font-size:.72rem;font-weight:400;letter-spacing:1px;margin-top:1px}

/* TOKEN BAR */
.token-bar{
  background:var(--parchment);border-bottom:2px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.token-bar label{font-size:.78rem;color:var(--muted);font-weight:600;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
.token-bar input{
  flex:1;min-width:220px;padding:9px 13px;border-radius:8px;
  border:2px solid var(--border);font-size:.82rem;font-family:monospace;
  background:var(--cream);color:var(--ink);outline:none;
  transition:border-color .15s;
}
.token-bar input:focus{border-color:var(--red)}
.token-tip{font-size:.7rem;color:#a08060;width:100%;margin-top:2px}

/* CONFIG BAR */
.config-bar{
  background:#fff8ec;border-bottom:2px solid var(--tan);
  padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
.config-bar label{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.config-bar input{
  flex:1;min-width:150px;padding:7px 10px;border-radius:7px;
  border:1.5px solid var(--border);font-size:.82rem;
  background:var(--cream);color:var(--ink);outline:none;
  transition:border-color .15s;
}
.config-bar input:focus{border-color:var(--saffron)}
.config-note{font-size:.68rem;color:#b08040;width:100%;margin-top:2px}

/* WRAP */
.wrap{max-width:860px;margin:0 auto;padding:16px 14px}

/* SECTION */
.section{background:#fff;border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.sec-hdr{
  background:linear-gradient(135deg,var(--red-dark),var(--red) 60%,var(--saffron));
  padding:11px 16px;display:flex;align-items:center;gap:8px;
  border-bottom:2px solid var(--gold);
}
.sec-hdr h2{color:#fff;font-size:.88rem;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.sec-count{
  margin-left:auto;background:rgba(255,255,255,0.2);
  color:#fff;font-size:.68rem;padding:2px 8px;border-radius:10px;
  font-weight:500;letter-spacing:.5px;
}

/* TABLE */
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:.68rem;color:#aaa;padding:8px 12px;
  border-bottom:2px solid var(--parchment);font-weight:600;
  letter-spacing:.8px;text-transform:uppercase;background:#fdfaf5;
}
th.r{text-align:right}
td{padding:9px 12px;font-size:.88rem;border-bottom:1px solid #faf0e0;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fffbf2}

.item-en{font-weight:600;color:var(--ink);font-size:.9rem}
.item-ur{font-family:'Noto Nastaliq Urdu',serif;direction:rtl;color:var(--muted);font-size:.8rem;margin-top:2px}
.item-id{font-size:.65rem;color:#ccc;font-family:monospace;margin-top:1px}

input[type=number]{
  width:90px;padding:7px 10px;border-radius:8px;
  border:1.5px solid var(--tan);font-size:.88rem;
  text-align:right;background:#fffdf8;color:var(--ink);
  outline:none;transition:border-color .15s;font-family:'Oswald',sans-serif;
}
input[type=number]:focus{border-color:var(--saffron)}
input[type=number].changed{border-color:var(--red);background:#fff8f5}
.dash{color:#ddd;font-size:1.1rem;display:block;text-align:center}

/* FOOTER */
.save-wrap{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--parchment);border-top:2px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;z-index:200;box-shadow:0 -4px 20px rgba(0,0,0,.1);
}
.save-info{font-size:.75rem;color:var(--muted);letter-spacing:.3px}
.save-info span{color:var(--red);font-weight:700}
.save-btn{
  padding:12px 32px;border-radius:10px;
  background:linear-gradient(135deg,var(--red),var(--saffron));
  color:#fff;border:none;font-size:.92rem;font-weight:700;
  cursor:pointer;letter-spacing:1px;text-transform:uppercase;
  box-shadow:0 4px 16px rgba(192,32,10,.35);transition:opacity .15s;
  font-family:'Oswald',sans-serif;
}
.save-btn:disabled{opacity:.5;cursor:not-allowed}

/* MESSAGES */
.msg{
  margin:12px 14px 0;padding:11px 14px;border-radius:10px;
  font-size:.84rem;font-weight:500;display:none;
}
.msg.ok{background:#e8f5e9;color:#1a7a1a;border:1.5px solid #a5d6a7;display:block}
.msg.err{background:#ffebee;color:#c00;border:1.5px solid #ef9a9a;display:block}

.loader{text-align:center;padding:40px;color:#bbb;font-size:.9rem;letter-spacing:1px}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🍽️ Lasani Menu Editor</h1>
    <div class="sub" id="lastUpdated">Loading…</div>
  </div>
</div>

<!-- GitHub Token -->
<div class="token-bar">
  <label>🔑 GitHub Token</label>
  <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" oninput="saveToken(this.value)">
  <span class="token-tip">Sirf is session ke liye save hota hai. Tab band karo toh hat jata hai.</span>
</div>

<!-- GitHub Config -->
<div class="config-bar">
  <label>Owner</label>
  <input type="text" id="cfgOwner" placeholder="syedtayaabbukhari-design">
  <label>Repo</label>
  <input type="text" id="cfgRepo" placeholder="lasani-v2">
  <label>Branch</label>
  <input type="text" id="cfgBranch" placeholder="main" style="flex:0 0 80px;min-width:60px">
  <span class="config-note">⚙️ Yeh settings sessionStorage mein save hoti hain.</span>
</div>

<div id="msgBox"></div>

<div class="wrap">
  <div id="cats"><div class="loader">Menu load ho rahi hai…</div></div>
</div>

<div class="save-wrap">
  <div class="save-info">Changes: <span id="changeCount">0</span></div>
  <button class="save-btn" id="saveBtn" onclick="saveMenu()">💾 Save &amp; Publish</button>
</div>

<script>
// ── ALL MENU DATA (matches index.html exactly) ─────────────────────────────
const MENU = [
  {
    id: 'main', label: '🍲 Main Course',
    items: [
      { id:1,   en:'Chicken Shami',     ur:'چکن شامی',       single:80 },
      { id:2,   en:'Egg Shami',         ur:'انڈے شامی',     single:250 },
      { id:3,   en:'Egg Chana',         ur:'انڈے چنے',      half:260, full:350 },
      { id:4,   en:'Kofta Chana',       ur:'کوفتہ چنے',     half:260, full:350 },
      { id:5,   en:'Chicken Qorma',     ur:'چکن قورمہ',     half:350, full:500 },
      { id:6,   en:'Dal Mash',          ur:'دال ماش',       half:260, full:350 },
      { id:7,   en:'Murgh Chana',       ur:'مرغ چنے',       half:350, full:500 },
      { id:8,   en:'Barey Paye',        ur:'بڑے پائے',      half:350, full:550 },
      { id:9,   en:'Haleem',            ur:'حلیم',           half:280, full:350 },
      { id:10,  en:'Chicken Haleem',    ur:'چکن حلیم',      half:350, full:500 },
      { id:11,  en:'Chana',             ur:'چنے',            half:220, full:300 },
      { id:12,  en:'Egg Haleem',        ur:'انڈے حلیم',     half:300, full:410 },
      { id:13,  en:'Dal Chana',         ur:'دال چنے',       half:260, full:350 },
      { id:14,  en:'Sabzi',             ur:'سبزی',           half:260, full:350 },
      { id:15,  en:'Kofta Haleem',      ur:'کوفتہ حلیم',    half:300, full:410 },
      { id:16,  en:'Chicken Dal Mash',  ur:'چکن دال ماش',   half:350, full:500 },
      { id:17,  en:'Chicken Dal Chana', ur:'چکن دال چنے',   half:350, full:500 },
      { id:18,  en:'Aloo Keema',        ur:'آلو قیمہ',      half:330, full:450 },
      { id:19,  en:'Chicken Sabzi',     ur:'چکن سبزی',      half:245, full:500 },
      { id:20,  en:'Kofta Sabzi',       ur:'کوفتہ سبزی',    half:300, full:410 },
      { id:21,  en:'Egg Sabzi',         ur:'انڈے سبزی',     half:300, full:410 },
      { id:22,  en:'Kofta Chana (2)',   ur:'کوفتہ چنے',     half:300, full:410 },
      { id:101, en:'Kofta Dal Mash',    ur:'کوفتہ دال ماش', half:300, full:410 },
      { id:102, en:'Chicken Kofta',     ur:'چکن کوفتہ',     single:400 },
      { id:103, en:'Egg Dal Chana',     ur:'انڈے دال چنے',  half:300, full:410 },
      { id:104, en:'Egg Dal Mash',      ur:'انڈے دال ماش',  half:300, full:410 },
      { id:105, en:'Kari Pakora',       ur:'کڑھی پکوڑہ',    half:260, full:350 },
    ]
  },
  {
    id: 'tandoor', label: '🫓 Tandoor',
    items: [
      { id:201, en:'Aloo Wala Naan', ur:'آلو والا نان', single:100 },
      { id:202, en:'Special Naan',   ur:'سپیشل نان',   single:80  },
      { id:203, en:'Kalonji Naan',   ur:'کلونجی نان',  single:80  },
      { id:204, en:'Roghni Naan',    ur:'روغنی نان',   single:80  },
      { id:205, en:'Sufaid Roti',    ur:'سفید روٹی',   single:30  },
      { id:206, en:'Kulcha Naan',    ur:'کلچہ نان',    single:40  },
    ]
  },
  {
    id: 'extras', label: '🥤 Extras & Beverages',
    items: [
      { id:301, en:'Aquafina (Small)',  ur:'پانی (چھوٹا)',  single:80  },
      { id:302, en:'Aquafina (1.5L)',   ur:'پانی (بڑا)',    single:130 },
      { id:303, en:'Cold Drink (1L)',   ur:'کولڈ ڈرنک',     single:180 },
      { id:304, en:'Cold Drink (1.5L)', ur:'کولڈ ڈرنک بڑا', single:250 },
      { id:305, en:'Raita',             ur:'رائتہ',          half:50, full:100 },
      { id:306, en:'Salad',             ur:'سلاد',           single:100 },
    ]
  }
];

// Working copy of prices
let prices = {};
let changeCount = 0;

// ── SESSION STORAGE ───────────────────────────────────────────────────────────
function saveToken(v){ sessionStorage.setItem('gh_token', v.trim()) }
function getToken(){ return sessionStorage.getItem('gh_token') || '' }

function saveCfg(){
  sessionStorage.setItem('gh_owner',  document.getElementById('cfgOwner').value.trim());
  sessionStorage.setItem('gh_repo',   document.getElementById('cfgRepo').value.trim());
  sessionStorage.setItem('gh_branch', document.getElementById('cfgBranch').value.trim() || 'main');
}
function getCfg(){
  return {
    owner:  sessionStorage.getItem('gh_owner')  || '',
    repo:   sessionStorage.getItem('gh_repo')   || '',
    branch: sessionStorage.getItem('gh_branch') || 'main',
  };
}

window.addEventListener('DOMContentLoaded', () => {
  // Restore token & config
  const t = getToken();
  if(t) document.getElementById('ghToken').value = t;
  const cfg = getCfg();
  if(cfg.owner)  document.getElementById('cfgOwner').value  = cfg.owner;
  if(cfg.repo)   document.getElementById('cfgRepo').value   = cfg.repo;
  if(cfg.branch) document.getElementById('cfgBranch').value = cfg.branch;

  ['cfgOwner','cfgRepo','cfgBranch'].forEach(id =>
    document.getElementById(id).addEventListener('input', saveCfg));

  loadPrices();
});

// ── LOAD PRICES FROM menu.json ────────────────────────────────────────────────
async function loadPrices(){
  // Init prices from hardcoded defaults
  MENU.forEach(cat => cat.items.forEach(item => {
    prices[item.id] = {};
    if(item.single !== undefined) prices[item.id].single = item.single;
    if(item.half   !== undefined) prices[item.id].half   = item.half;
    if(item.full   !== undefined) prices[item.id].full   = item.full;
  }));

  try {
    const r = await fetch('/menu.json?t=' + Date.now());
    if(r.ok){
      const json = await r.json();
      document.getElementById('lastUpdated').textContent = 'Last updated: ' + (json.lastUpdated || 'unknown');
      // Override defaults with saved prices
      json.categories.forEach(cat => {
        cat.items.forEach(ji => {
          if(!prices[ji.id]) return;
          if(ji.single !== undefined) prices[ji.id].single = ji.single;
          if(ji.half   !== undefined) prices[ji.id].half   = ji.half;
          if(ji.full   !== undefined) prices[ji.id].full   = ji.full;
        });
      });
    } else {
      document.getElementById('lastUpdated').textContent = 'menu.json nahi mili — default prices show ho rahe hain';
    }
  } catch(e) {
    document.getElementById('lastUpdated').textContent = 'Offline — default prices';
  }

  renderMenu();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderMenu(){
  const container = document.getElementById('cats');
  container.innerHTML = '';

  MENU.forEach(cat => {
    const sec = document.createElement('div');
    sec.className = 'section';

    const rows = cat.items.map(item => {
      const p = prices[item.id] || {};
      const hasSingle = item.single !== undefined;
      const hasHalf   = item.half   !== undefined;
      const hasFull   = item.full   !== undefined;

      return `<tr>
        <td>
          <div class="item-en">${item.en}</div>
          <div class="item-ur">${item.ur}</div>
          <div class="item-id">#${item.id}</div>
        </td>
        <td>${hasSingle
          ? `<input type="number" min="0" step="5" value="${p.single}"
               onchange="updatePrice(${item.id},'single',this.value,this)">`
          : '<span class="dash">—</span>'}</td>
        <td>${hasHalf
          ? `<input type="number" min="0" step="5" value="${p.half}"
               onchange="updatePrice(${item.id},'half',this.value,this)">`
          : '<span class="dash">—</span>'}</td>
        <td>${hasFull
          ? `<input type="number" min="0" step="5" value="${p.full}"
               onchange="updatePrice(${item.id},'full',this.value,this)">`
          : '<span class="dash">—</span>'}</td>
      </tr>`;
    }).join('');

    sec.innerHTML = `
      <div class="sec-hdr">
        <h2>${cat.label}</h2>
        <span class="sec-count">${cat.items.length} items</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th class="r">Single (Rs.)</th>
            <th class="r">Half (Rs.)</th>
            <th class="r">Full (Rs.)</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
    container.appendChild(sec);
  });
}

function updatePrice(id, field, val, el){
  if(!prices[id]) prices[id] = {};
  prices[id][field] = Number(val);
  el.classList.add('changed');
  changeCount++;
  document.getElementById('changeCount').textContent = changeCount;
}

// ── SAVE TO GITHUB ────────────────────────────────────────────────────────────
async function saveMenu(){
  const token = getToken();
  if(!token || !token.startsWith('ghp_')){
    showMsg('err','❌ Pehle GitHub Token enter karo (ghp_xxx...)'); return;
  }
  const cfg = getCfg();
  if(!cfg.owner || !cfg.repo){
    showMsg('err','❌ GitHub Owner aur Repo name zaroor bharo (upar config mein)'); return;
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  showMsg('', '');

  try {
    // Build menu.json from current prices
    const today = new Date().toISOString().slice(0,10);
    const output = {
      lastUpdated: today,
      categories: MENU.map(cat => ({
        id: cat.id,
        label: cat.label.replace(/^[^\w]+/, '').trim(),
        items: cat.items.map(item => {
          const p = prices[item.id] || {};
          const obj = { id: item.id, en: item.en, ur: item.ur };
          if(item.single !== undefined) obj.single = p.single ?? item.single;
          if(item.half   !== undefined) obj.half   = p.half   ?? item.half;
          if(item.full   !== undefined) obj.full   = p.full   ?? item.full;
          return obj;
        })
      }))
    };

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(output, null, 2))));
    const apiUrl  = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/menu.json`;
    const headers = {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
      'X-GitHub-Api-Version': '2022-11-28',
    };

    // Get current SHA
    const getRes  = await fetch(apiUrl + '?ref=' + cfg.branch, { headers });
    const getJson = await getRes.json();
    if(!getRes.ok) throw new Error('SHA fetch failed: ' + getJson.message);

    // Commit
    const putRes  = await fetch(apiUrl, {
      method: 'PUT', headers,
      body: JSON.stringify({
        message: 'chore: update menu prices ' + today,
        content,
        sha: getJson.sha,
        branch: cfg.branch,
        committer: { name: 'Lasani Admin', email: 'admin@lasani.com' },
      }),
    });
    const putJson = await putRes.json();
    if(!putRes.ok) throw new Error(putJson.message);

    showMsg('ok','✅ GitHub par save ho gaya! 1-2 minute mein site live ho jayegi.');
    document.getElementById('lastUpdated').textContent = 'Last updated: ' + today;
    changeCount = 0;
    document.getElementById('changeCount').textContent = '0';
    document.querySelectorAll('input.changed').forEach(el => el.classList.remove('changed'));

  } catch(e){
    showMsg('err','❌ Error: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '💾 Save & Publish';
  }
}

function showMsg(type, text){
  const box = document.getElementById('msgBox');
  if(!text){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="msg ${type}">${text}</div>`;
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}
</script>
</body>
</html>
